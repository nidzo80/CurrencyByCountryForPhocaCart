; Currency By Country Plugin for Phoca Cart - Language file
;
PLG_SYSTEM_CURRENCYBYCOUNTRY="Pcv - Currency By Country for Phoca Cart"
PLG_SYSTEM_CURRENCYBYCOUNTRY_XML_DESCRIPTION="Suggests or automatically switches the shop currency based on the billing country entered during checkout."

PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_MODE_LABEL="Mode"
PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_MODE_DESC="Off: disabled. Suggest: show a banner offering to switch currency. Auto: switch currency automatically and reload the page."
PLG_SYSTEM_CURRENCYBYCOUNTRY_MODE_OFF="Off"
PLG_SYSTEM_CURRENCYBYCOUNTRY_MODE_SUGGEST="Suggest (show banner)"
PLG_SYSTEM_CURRENCYBYCOUNTRY_MODE_AUTO="Auto switch"

PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_MAPPING_LABEL="Country → Currency mapping"
PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_MAPPING_DESC="Map a 2-letter country code to a 3-letter currency code. Only countries listed here are affected - other countries keep the default currency."
PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_COUNTRY_LABEL="Country code (ISO 3166 alpha-2)"
PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_CURRENCY_LABEL="Currency code"
PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_COUNTRY_DESC="ISO 3166 alpha-2 country code, e.g. DE"
PLG_SYSTEM_CURRENCYBYCOUNTRY_FIELD_CURRENCY_DESC="ISO 4217 currency code, e.g. EUR"

PLG_SYSTEM_CURRENCYBYCOUNTRY_SUGGEST_TEXT="It looks like you're shopping from %s. Would you like to switch to %s?"
PLG_SYSTEM_CURRENCYBYCOUNTRY_SUGGEST_SWITCH="Switch currency"
PLG_SYSTEM_CURRENCYBYCOUNTRY_SUGGEST_DISMISS="No thanks"
